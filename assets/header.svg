<style>text{font-family:'JetBrains Mono','Fira Code','SF Mono',Consolas,'Courier New',monospace}.scan{animation:sweep 6s linear infinite}@keyframes sweep{from{transform:translateY(0)}to{transform:translateY(300px)}}.br{animation:pulse 3s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@media (prefers-reduced-motion: reduce){*{animation:none!important}.cover{display:none}}</style>

