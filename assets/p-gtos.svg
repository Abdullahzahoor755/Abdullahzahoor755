<svg xmlns="http://www.w3.org/2000/svg" width="490" height="444" viewBox="0 0 490 444" role="img" aria-labelledby="t d">
<title id="t">GTOS Admin Dashboard</title>
<desc id="d">GTOS Admin Dashboard project card: operations monorepo with admin dashboard and employee PWA built with TypeScript, Next.js, Prisma and PostgreSQL. Private repository, in development.</desc>
<style>text{font-family:'JetBrains Mono','Fira Code','SF Mono',Consolas,'Courier New',monospace}@media (prefers-reduced-motion: reduce){*{animation:none!important}.cover{display:none}}</style>
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#00ff9c"/><stop offset=".55" stop-color="#00e5ff"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><rect width="490" height="444" rx="8" fill="#0d1416"/><rect x=".5" y=".5" width="489" height="443" rx="8" fill="none" stroke="#1d2c2e"/><rect x="0" y="0" width="490" height="3" fill="url(#g)"/><text x="24" y="38" font-size="12" letter-spacing="2" fill="#6f8788">PRIVATE REPO</text><text x="24" y="66" font-size="21" font-weight="700" fill="#8b5cf6">GTOS Admin Dashboard</text><rect x="326" y="22" width="140" height="24" rx="12" fill="#00ff9c" fill-opacity=".1" stroke="#00ff9c" stroke-opacity=".7"/><circle cx="340" cy="34" r="3.5" fill="#00ff9c"/><text x="350" y="38.5" font-size="11" letter-spacing=".8" fill="#00ff9c">IN DEVELOPMENT</text><text x="24" y="98" font-size="11" letter-spacing="2" fill="#8b5cf6">PROBLEM</text><text x="24" y="118" font-size="13" fill="#c9d6d6">A trades business needs one system for management and field</text><text x="24" y="138" font-size="13" fill="#c9d6d6">crews. GTOS is a modular monorepo with a shared backend and</text><text x="24" y="158" font-size="13" fill="#c9d6d6">two interfaces.</text><text x="24" y="188" font-size="11" letter-spacing="2" fill="#8b5cf6">KEY CAPABILITIES</text><text x="24" y="208" font-size="13" fill="#8b5cf6">▸</text><text x="42" y="208" font-size="13" fill="#c9d6d6">Monorepo: admin dashboard, mobile-first employee PWA,</text><text x="42" y="227" font-size="13" fill="#c9d6d6">shared API and background jobs</text><text x="24" y="246" font-size="13" fill="#8b5cf6">▸</text><text x="42" y="246" font-size="13" fill="#c9d6d6">Domain packages for auth, audit, queue, storage,</text><text x="42" y="265" font-size="13" fill="#c9d6d6">notifications and observability</text><text x="24" y="284" font-size="13" fill="#8b5cf6">▸</text><text x="42" y="284" font-size="13" fill="#c9d6d6">PostgreSQL system of record; Redis queues; MinIO</text><text x="42" y="303" font-size="13" fill="#c9d6d6">private object storage</text><text x="24" y="322" font-size="13" fill="#8b5cf6">▸</text><text x="42" y="322" font-size="13" fill="#c9d6d6">Vitest and Playwright testing with GitHub Actions</text><text x="42" y="341" font-size="13" fill="#c9d6d6">release gates</text><line x1="24" y1="362" x2="466" y2="362" stroke="#1d2c2e"/><rect x="24" y="372" width="90" height="22" rx="4" fill="#8b5cf6" fill-opacity=".08" stroke="#8b5cf6" stroke-opacity=".4"/><text x="69" y="387" text-anchor="middle" font-size="11.5" fill="#8b5cf6">TypeScript</text><rect x="122" y="372" width="68" height="22" rx="4" fill="#8b5cf6" fill-opacity=".08" stroke="#8b5cf6" stroke-opacity=".4"/><text x="156" y="387" text-anchor="middle" font-size="11.5" fill="#8b5cf6">Next.js</text><rect x="198" y="372" width="61" height="22" rx="4" fill="#8b5cf6" fill-opacity=".08" stroke="#8b5cf6" stroke-opacity=".4"/><text x="229" y="387" text-anchor="middle" font-size="11.5" fill="#8b5cf6">Prisma</text><rect x="268" y="372" width="90" height="22" rx="4" fill="#8b5cf6" fill-opacity=".08" stroke="#8b5cf6" stroke-opacity=".4"/><text x="313" y="387" text-anchor="middle" font-size="11.5" fill="#8b5cf6">PostgreSQL</text><rect x="366" y="372" width="54" height="22" rx="4" fill="#8b5cf6" fill-opacity=".08" stroke="#8b5cf6" stroke-opacity=".4"/><text x="393" y="387" text-anchor="middle" font-size="11.5" fill="#8b5cf6">Redis</text><rect x="24" y="400" width="61" height="22" rx="4" fill="#8b5cf6" fill-opacity=".08" stroke="#8b5cf6" stroke-opacity=".4"/><text x="55" y="415" text-anchor="middle" font-size="11.5" fill="#8b5cf6">Docker</text><rect x="93" y="400" width="90" height="22" rx="4" fill="#8b5cf6" fill-opacity=".08" stroke="#8b5cf6" stroke-opacity=".4"/><text x="138" y="415" text-anchor="middle" font-size="11.5" fill="#8b5cf6">Playwright</text>
</svg>
