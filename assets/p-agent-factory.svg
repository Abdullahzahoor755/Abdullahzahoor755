<svg xmlns="http://www.w3.org/2000/svg" width="490" height="444" viewBox="0 0 490 444" role="img" aria-labelledby="t d">
<title id="t">Agent Factory Book</title>
<desc id="d">Agent Factory Book project card: retrieval-augmented tutor built with FastAPI, ChromaDB and OpenAI. Public repository.</desc>
<style>text{font-family:'JetBrains Mono','Fira Code','SF Mono',Consolas,'Courier New',monospace}@media (prefers-reduced-motion: reduce){*{animation:none!important}.cover{display:none}}</style>
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#00ff9c"/><stop offset=".55" stop-color="#00e5ff"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><rect width="490" height="444" rx="8" fill="#0d1416"/><rect x=".5" y=".5" width="489" height="443" rx="8" fill="none" stroke="#1d2c2e"/><rect x="0" y="0" width="490" height="3" fill="url(#g)"/><text x="24" y="38" font-size="12" letter-spacing="2" fill="#6f8788">PUBLIC REPO</text><text x="24" y="66" font-size="21" font-weight="700" fill="#00ff9c">Agent Factory Book</text><rect x="326" y="22" width="140" height="24" rx="12" fill="#00ff9c" fill-opacity=".1" stroke="#00ff9c" stroke-opacity=".7"/><circle cx="340" cy="34" r="3.5" fill="#00ff9c"/><text x="350" y="38.5" font-size="11" letter-spacing=".8" fill="#00ff9c">IN DEVELOPMENT</text><text x="24" y="98" font-size="11" letter-spacing="2" fill="#00ff9c">PROBLEM</text><text x="24" y="118" font-size="13" fill="#c9d6d6">A course site where learners can ask questions and get</text><text x="24" y="138" font-size="13" fill="#c9d6d6">answers grounded only in the book content, not the model&#x27;s</text><text x="24" y="158" font-size="13" fill="#c9d6d6">guesses.</text><text x="24" y="188" font-size="11" letter-spacing="2" fill="#00ff9c">KEY CAPABILITIES</text><text x="24" y="208" font-size="13" fill="#00ff9c">▸</text><text x="42" y="208" font-size="13" fill="#c9d6d6">FastAPI backend with a RAG tutor over markdown</text><text x="42" y="227" font-size="13" fill="#c9d6d6">knowledge base</text><text x="24" y="246" font-size="13" fill="#00ff9c">▸</text><text x="42" y="246" font-size="13" fill="#c9d6d6">ChromaDB vector store with OpenAI-based embeddings and</text><text x="42" y="265" font-size="13" fill="#c9d6d6">chat</text><text x="24" y="284" font-size="13" fill="#00ff9c">▸</text><text x="42" y="284" font-size="13" fill="#c9d6d6">JWT authentication and encrypted storage for user API</text><text x="42" y="303" font-size="13" fill="#c9d6d6">connections</text><text x="24" y="322" font-size="13" fill="#00ff9c">▸</text><text x="42" y="322" font-size="13" fill="#c9d6d6">Static frontend with login, dashboard, tools and chat</text><text x="42" y="341" font-size="13" fill="#c9d6d6">pages</text><line x1="24" y1="362" x2="466" y2="362" stroke="#1d2c2e"/><rect x="24" y="372" width="61" height="22" rx="4" fill="#00ff9c" fill-opacity=".08" stroke="#00ff9c" stroke-opacity=".4"/><text x="55" y="387" text-anchor="middle" font-size="11.5" fill="#00ff9c">Python</text><rect x="93" y="372" width="68" height="22" rx="4" fill="#00ff9c" fill-opacity=".08" stroke="#00ff9c" stroke-opacity=".4"/><text x="127" y="387" text-anchor="middle" font-size="11.5" fill="#00ff9c">FastAPI</text><rect x="170" y="372" width="76" height="22" rx="4" fill="#00ff9c" fill-opacity=".08" stroke="#00ff9c" stroke-opacity=".4"/><text x="207" y="387" text-anchor="middle" font-size="11.5" fill="#00ff9c">ChromaDB</text><rect x="253" y="372" width="61" height="22" rx="4" fill="#00ff9c" fill-opacity=".08" stroke="#00ff9c" stroke-opacity=".4"/><text x="284" y="387" text-anchor="middle" font-size="11.5" fill="#00ff9c">OpenAI</text><rect x="322" y="372" width="90" height="22" rx="4" fill="#00ff9c" fill-opacity=".08" stroke="#00ff9c" stroke-opacity=".4"/><text x="367" y="387" text-anchor="middle" font-size="11.5" fill="#00ff9c">SQLAlchemy</text><rect x="420" y="372" width="40" height="22" rx="4" fill="#00ff9c" fill-opacity=".08" stroke="#00ff9c" stroke-opacity=".4"/><text x="440" y="387" text-anchor="middle" font-size="11.5" fill="#00ff9c">JWT</text>
</svg>
