<svg xmlns="http://www.w3.org/2000/svg" width="490" height="359" viewBox="0 0 490 359" role="img" aria-labelledby="t d">
<title id="t">Silver Agent v2.0</title>
<desc id="d">Silver Agent v2.0 project card: local-first Gmail assistant using Python and Ollama. Public repository.</desc>
<style>text{font-family:'JetBrains Mono','Fira Code','SF Mono',Consolas,'Courier New',monospace}@media (prefers-reduced-motion: reduce){*{animation:none!important}.cover{display:none}}</style>
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#00ff9c"/><stop offset=".55" stop-color="#00e5ff"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><rect width="490" height="359" rx="8" fill="#0d1416"/><rect x=".5" y=".5" width="489" height="358" rx="8" fill="none" stroke="#1d2c2e"/><rect x="0" y="0" width="490" height="3" fill="url(#g)"/><text x="24" y="38" font-size="12" letter-spacing="2" fill="#6f8788">PUBLIC REPO</text><text x="24" y="66" font-size="21" font-weight="700" fill="#00e5ff">Silver Agent v2.0</text><rect x="312" y="22" width="154" height="24" rx="12" fill="#00e5ff" fill-opacity=".1" stroke="#00e5ff" stroke-opacity=".7"/><circle cx="326" cy="34" r="3.5" fill="#00e5ff"/><text x="336" y="38.5" font-size="11" letter-spacing=".8" fill="#00e5ff">PERSONAL PROJECT</text><text x="24" y="98" font-size="11" letter-spacing="2" fill="#00e5ff">PROBLEM</text><text x="24" y="118" font-size="13" fill="#c9d6d6">An email assistant that runs on low-end hardware without a</text><text x="24" y="138" font-size="13" fill="#c9d6d6">GPU, drafting replies and keeping a searchable record of</text><text x="24" y="158" font-size="13" fill="#c9d6d6">activity.</text><text x="24" y="188" font-size="11" letter-spacing="2" fill="#00e5ff">KEY CAPABILITIES</text><text x="24" y="208" font-size="13" fill="#00e5ff">▸</text><text x="42" y="208" font-size="13" fill="#c9d6d6">Monitors Gmail through the Gmail API and drafts</text><text x="42" y="227" font-size="13" fill="#c9d6d6">context-aware replies</text><text x="24" y="246" font-size="13" fill="#00e5ff">▸</text><text x="42" y="246" font-size="13" fill="#c9d6d6">Runs local LLMs through Ollama; Supabase and Discord</text><text x="42" y="265" font-size="13" fill="#c9d6d6">webhook integrations</text><text x="24" y="284" font-size="13" fill="#00e5ff">▸</text><text x="42" y="284" font-size="13" fill="#c9d6d6">Syncs interactions into an Obsidian knowledge base</text><line x1="24" y1="305" x2="466" y2="305" stroke="#1d2c2e"/><rect x="24" y="315" width="61" height="22" rx="4" fill="#00e5ff" fill-opacity=".08" stroke="#00e5ff" stroke-opacity=".4"/><text x="55" y="330" text-anchor="middle" font-size="11.5" fill="#00e5ff">Python</text><rect x="93" y="315" width="61" height="22" rx="4" fill="#00e5ff" fill-opacity=".08" stroke="#00e5ff" stroke-opacity=".4"/><text x="124" y="330" text-anchor="middle" font-size="11.5" fill="#00e5ff">Ollama</text><rect x="162" y="315" width="83" height="22" rx="4" fill="#00e5ff" fill-opacity=".08" stroke="#00e5ff" stroke-opacity=".4"/><text x="204" y="330" text-anchor="middle" font-size="11.5" fill="#00e5ff">Gmail API</text><rect x="253" y="315" width="76" height="22" rx="4" fill="#00e5ff" fill-opacity=".08" stroke="#00e5ff" stroke-opacity=".4"/><text x="291" y="330" text-anchor="middle" font-size="11.5" fill="#00e5ff">Supabase</text><rect x="337" y="315" width="61" height="22" rx="4" fill="#00e5ff" fill-opacity=".08" stroke="#00e5ff" stroke-opacity=".4"/><text x="367" y="330" text-anchor="middle" font-size="11.5" fill="#00e5ff">SQLite</text><rect x="406" y="315" width="47" height="22" rx="4" fill="#00e5ff" fill-opacity=".08" stroke="#00e5ff" stroke-opacity=".4"/><text x="429" y="330" text-anchor="middle" font-size="11.5" fill="#00e5ff">Rich</text>
</svg>
