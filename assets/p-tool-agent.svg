<svg xmlns="http://www.w3.org/2000/svg" width="490" height="464" viewBox="0 0 490 464" role="img" aria-labelledby="t d">
<title id="t">GitHub Tool Acquisition Agent</title>
<desc id="d">GitHub Tool Acquisition Agent project card: secure discovery, inspection and sandboxing of GitHub tools using Python and Docker. Private repository, early development.</desc>
<style>text{font-family:'JetBrains Mono','Fira Code','SF Mono',Consolas,'Courier New',monospace}@media (prefers-reduced-motion: reduce){*{animation:none!important}.cover{display:none}}</style>
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#00ff9c"/><stop offset=".55" stop-color="#00e5ff"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><rect width="490" height="464" rx="8" fill="#0d1416"/><rect x=".5" y=".5" width="489" height="463" rx="8" fill="none" stroke="#1d2c2e"/><rect x="0" y="0" width="490" height="3" fill="url(#g)"/><text x="24" y="38" font-size="12" letter-spacing="2" fill="#6f8788">PRIVATE REPO</text><text x="24" y="66" font-size="21" font-weight="700" fill="#00e5ff">GitHub Tool Acquisition Agent</text><rect x="304" y="22" width="162" height="24" rx="12" fill="#f59e0b" fill-opacity=".1" stroke="#f59e0b" stroke-opacity=".7"/><circle cx="318" cy="34" r="3.5" fill="#f59e0b"/><text x="328" y="38.5" font-size="11" letter-spacing=".8" fill="#f59e0b">EARLY DEVELOPMENT</text><text x="24" y="98" font-size="11" letter-spacing="2" fill="#00e5ff">PROBLEM</text><text x="24" y="118" font-size="13" fill="#c9d6d6">Useful open-source tools are hard to find, judge and run</text><text x="24" y="138" font-size="13" fill="#c9d6d6">safely. This agent turns a plain-language need into a</text><text x="24" y="158" font-size="13" fill="#c9d6d6">vetted, sandboxed tool.</text><text x="24" y="188" font-size="11" letter-spacing="2" fill="#00e5ff">KEY CAPABILITIES</text><text x="24" y="208" font-size="13" fill="#00e5ff">▸</text><text x="42" y="208" font-size="13" fill="#c9d6d6">Discovers and explainably ranks GitHub candidates</text><text x="42" y="227" font-size="13" fill="#c9d6d6">through the official API</text><text x="24" y="246" font-size="13" fill="#00e5ff">▸</text><text x="42" y="246" font-size="13" fill="#c9d6d6">Commit-pinned, size-limited, hash-verified source</text><text x="42" y="265" font-size="13" fill="#c9d6d6">acquisition; static inspection without executing code</text><text x="24" y="284" font-size="13" fill="#00e5ff">▸</text><text x="42" y="284" font-size="13" fill="#c9d6d6">Deterministic build plans and hardened Docker</text><text x="42" y="303" font-size="13" fill="#c9d6d6">sandboxes with audit and provenance records</text><text x="24" y="322" font-size="13" fill="#00e5ff">▸</text><text x="42" y="322" font-size="13" fill="#c9d6d6">Clean architecture (domain / application /</text><text x="42" y="341" font-size="13" fill="#c9d6d6">infrastructure / CLI) with strict typing and 90%</text><text x="42" y="360" font-size="13" fill="#c9d6d6">coverage gate</text><line x1="24" y1="381" x2="466" y2="381" stroke="#1d2c2e"/><rect x="24" y="391" width="97" height="22" rx="4" fill="#00e5ff" fill-opacity=".08" stroke="#00e5ff" stroke-opacity=".4"/><text x="73" y="406" text-anchor="middle" font-size="11.5" fill="#00e5ff">Python 3.12</text><rect x="129" y="391" width="54" height="22" rx="4" fill="#00e5ff" fill-opacity=".08" stroke="#00e5ff" stroke-opacity=".4"/><text x="156" y="406" text-anchor="middle" font-size="11.5" fill="#00e5ff">Typer</text><rect x="191" y="391" width="90" height="22" rx="4" fill="#00e5ff" fill-opacity=".08" stroke="#00e5ff" stroke-opacity=".4"/><text x="236" y="406" text-anchor="middle" font-size="11.5" fill="#00e5ff">SQLAlchemy</text><rect x="289" y="391" width="68" height="22" rx="4" fill="#00e5ff" fill-opacity=".08" stroke="#00e5ff" stroke-opacity=".4"/><text x="323" y="406" text-anchor="middle" font-size="11.5" fill="#00e5ff">Alembic</text><rect x="366" y="391" width="61" height="22" rx="4" fill="#00e5ff" fill-opacity=".08" stroke="#00e5ff" stroke-opacity=".4"/><text x="396" y="406" text-anchor="middle" font-size="11.5" fill="#00e5ff">Docker</text><rect x="24" y="419" width="76" height="22" rx="4" fill="#00e5ff" fill-opacity=".08" stroke="#00e5ff" stroke-opacity=".4"/><text x="62" y="434" text-anchor="middle" font-size="11.5" fill="#00e5ff">Pydantic</text><rect x="108" y="419" width="61" height="22" rx="4" fill="#00e5ff" fill-opacity=".08" stroke="#00e5ff" stroke-opacity=".4"/><text x="138" y="434" text-anchor="middle" font-size="11.5" fill="#00e5ff">pytest</text>
</svg>
