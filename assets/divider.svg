<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="24" viewBox="0 0 1000 24" role="img" aria-labelledby="t d">
<title id="t">Section divider</title>
<desc id="d">Decorative neon divider line</desc>
<style>text{font-family:'JetBrains Mono','Fira Code','SF Mono',Consolas,'Courier New',monospace}.p{animation:mv 5s linear infinite}@keyframes mv{to{transform:translateX(1160px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}.cover{display:none}}</style>

<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#00ff9c"/><stop offset=".55" stop-color="#00e5ff"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient><linearGradient id="pulse" x1="0" x2="1"><stop offset="0" stop-color="#00ff9c" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#00e5ff" stop-opacity="0"/></linearGradient></defs>
<rect x="0" y="11" width="1000" height="2" fill="url(#g)" opacity=".5"/>
<rect class="p" x="-160" y="10" width="160" height="4" rx="2" fill="url(#pulse)"/>
<rect x="495.0" y="7" width="10" height="10" transform="rotate(45 500.0 12)" fill="#0a0e0f" stroke="#00ff9c"/>

</svg>
