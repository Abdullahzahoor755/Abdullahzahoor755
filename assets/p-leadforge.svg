<svg xmlns="http://www.w3.org/2000/svg" width="490" height="464" viewBox="0 0 490 464" role="img" aria-labelledby="t d">
<title id="t">LeadForge AI</title>
<desc id="d">LeadForge AI project card: multi-tenant AI lead generation and outreach platform built with Python, FastAPI, PostgreSQL, Claude and Groq. Status: in development.</desc>
<style>text{font-family:'JetBrains Mono','Fira Code','SF Mono',Consolas,'Courier New',monospace}@media (prefers-reduced-motion: reduce){*{animation:none!important}.cover{display:none}}</style>
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#00ff9c"/><stop offset=".55" stop-color="#00e5ff"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><rect width="490" height="464" rx="8" fill="#0d1416"/><rect x=".5" y=".5" width="489" height="463" rx="8" fill="none" stroke="#1d2c2e"/><rect x="0" y="0" width="490" height="3" fill="url(#g)"/><text x="24" y="38" font-size="12" letter-spacing="2" fill="#6f8788">PUBLIC REPO</text><text x="24" y="66" font-size="21" font-weight="700" fill="#00ff9c">LeadForge AI</text><rect x="326" y="22" width="140" height="24" rx="12" fill="#00ff9c" fill-opacity=".1" stroke="#00ff9c" stroke-opacity=".7"/><circle cx="340" cy="34" r="3.5" fill="#00ff9c"/><text x="350" y="38.5" font-size="11" letter-spacing=".8" fill="#00ff9c">IN DEVELOPMENT</text><text x="24" y="98" font-size="11" letter-spacing="2" fill="#00ff9c">PROBLEM</text><text x="24" y="118" font-size="13" fill="#c9d6d6">Finding real business leads, qualifying them and running</text><text x="24" y="138" font-size="13" fill="#c9d6d6">personalised outreach is slow and manual. LeadForge</text><text x="24" y="158" font-size="13" fill="#c9d6d6">automates the pipeline from lead discovery to reply</text><text x="24" y="178" font-size="13" fill="#c9d6d6">tracking.</text><text x="24" y="208" font-size="11" letter-spacing="2" fill="#00ff9c">KEY CAPABILITIES</text><text x="24" y="228" font-size="13" fill="#00ff9c">▸</text><text x="42" y="228" font-size="13" fill="#c9d6d6">Registry of pluggable agents: lead generation,</text><text x="42" y="247" font-size="13" fill="#c9d6d6">outreach, follow-up, reply monitoring, voice outreach</text><text x="24" y="266" font-size="13" fill="#00ff9c">▸</text><text x="42" y="266" font-size="13" fill="#c9d6d6">Multi-tenant design: tenant_id on core models,</text><text x="42" y="285" font-size="13" fill="#c9d6d6">tenant-scoped repositories and request middleware</text><text x="24" y="304" font-size="13" fill="#00ff9c">▸</text><text x="42" y="304" font-size="13" fill="#c9d6d6">Claude-based lead analysis with a Groq provider</text><text x="42" y="323" font-size="13" fill="#c9d6d6">option; Gmail and Vapi voice providers</text><text x="24" y="342" font-size="13" fill="#00ff9c">▸</text><text x="42" y="342" font-size="13" fill="#c9d6d6">Async background job queue, Postgres-first backend,</text><text x="42" y="361" font-size="13" fill="#c9d6d6">FastAPI + dashboard</text><line x1="24" y1="382" x2="466" y2="382" stroke="#1d2c2e"/><rect x="24" y="392" width="61" height="22" rx="4" fill="#00ff9c" fill-opacity=".08" stroke="#00ff9c" stroke-opacity=".4"/><text x="55" y="407" text-anchor="middle" font-size="11.5" fill="#00ff9c">Python</text><rect x="93" y="392" width="68" height="22" rx="4" fill="#00ff9c" fill-opacity=".08" stroke="#00ff9c" stroke-opacity=".4"/><text x="127" y="407" text-anchor="middle" font-size="11.5" fill="#00ff9c">FastAPI</text><rect x="170" y="392" width="90" height="22" rx="4" fill="#00ff9c" fill-opacity=".08" stroke="#00ff9c" stroke-opacity=".4"/><text x="215" y="407" text-anchor="middle" font-size="11.5" fill="#00ff9c">PostgreSQL</text><rect x="268" y="392" width="90" height="22" rx="4" fill="#00ff9c" fill-opacity=".08" stroke="#00ff9c" stroke-opacity=".4"/><text x="313" y="407" text-anchor="middle" font-size="11.5" fill="#00ff9c">SQLAlchemy</text><rect x="366" y="392" width="90" height="22" rx="4" fill="#00ff9c" fill-opacity=".08" stroke="#00ff9c" stroke-opacity=".4"/><text x="411" y="407" text-anchor="middle" font-size="11.5" fill="#00ff9c">Claude API</text><rect x="24" y="420" width="47" height="22" rx="4" fill="#00ff9c" fill-opacity=".08" stroke="#00ff9c" stroke-opacity=".4"/><text x="47" y="435" text-anchor="middle" font-size="11.5" fill="#00ff9c">Groq</text><rect x="79" y="420" width="47" height="22" rx="4" fill="#00ff9c" fill-opacity=".08" stroke="#00ff9c" stroke-opacity=".4"/><text x="102" y="435" text-anchor="middle" font-size="11.5" fill="#00ff9c">Vapi</text>
</svg>
